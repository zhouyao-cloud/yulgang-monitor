name: Weekly Monitor

on:
  workflow_dispatch:

  schedule:
    # 台湾/北京时间 07:00、07:30、08:00、08:30、09:00、09:30、10:00
    # GitHub cron 使用 UTC
    - cron: "0 23 * * *"
    - cron: "30 23 * * *"
    - cron: "0 0 * * *"
    - cron: "30 0 * * *"
    - cron: "0 1 * * *"
    - cron: "30 1 * * *"
    - cron: "0 2 * * *"

concurrency:
  group: redmoon-daily-report
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 gspread discord.py google-auth google-play-scraper app-store-scraper

      - name: Fetch Monitor Data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          python scripts/fetch_bahamut.py
