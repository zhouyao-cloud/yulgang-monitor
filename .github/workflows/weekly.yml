name: Weekly Monitor

on:
  workflow_dispatch:

jobs:
  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python Version
        run: python --version

      - name: Run Script
        run: python scripts/test.py
